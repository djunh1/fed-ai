# FMP earnings, incremental: refresh only new, stale and unresolved symbols
# against the newest snapshot (ADR 0004). Falls back to a full run if none.
# Roughly a quarter of the universe per monthly run. Needs FMP_API_KEY.
# Output: data/fmp_earnings/earnings_<UTC timestamp>.parquet (ADR 0002).

parameters:
  # Universe screen (ADR 0006). Sister project defaults; change per run.
  min_price: 5.0
  min_market_cap: 300000000
  min_volume: 200000
  exchanges: [NYSE, NASDAQ, AMEX]

  data_dir: data/fmp_earnings
  incremental: true
  stale_after_days: 75
  # Caps symbols per step, largest market cap first. In a full run this
  # writes a partial snapshot as the newest; use a separate data_dir (see _qa).
  limit: null
  # Above this share of failed symbols, nothing is written.
  max_failure_pct: 5.0

  # Optional: replace the screen with named tickers.
  symbols: null

  # Price action (ADR 0008). Rows before this date are not priced.
  enriched_dir: data/fmp_enriched
  price_action_from: "2016-01-01"
  # Optional: last announcement date in the enriched file. Returns still use
  # later prices. Earnings snapshot is unaffected. null = through today.
  price_action_to: null
